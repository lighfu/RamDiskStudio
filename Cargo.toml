[package]
name = "ramdisk-studio"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.1"

[[bin]]
name = "RamDiskStudio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
ferrisetw = "1.2"
gpui = { path = "../m3e-sdk/vendor/gpui", default-features = false }
m3e = { version = "1.0.1", path = "../m3e-sdk/rust/m3e" }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
